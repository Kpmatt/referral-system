<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紹介ネットワーク図</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d0d14;
    --surface: #13131f;
    --border: #1e1e32;
    --you-color: #e94560;
    --l1-color: #f5a623;
    --l2-color: #4ecdc4;
    --l3-color: #a8b5c8;
    --text: #e8eaf0;
    --muted: #666880;
    --accent: #e94560;
    --green: #2ecc71;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #0d0d14 0%, #13131f 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  .logo-dot {
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.6; transform:scale(1.3); }
  }
  header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
  }
  .tab-bar {
    margin-left: auto;
    display: flex;
    gap: 4px;
    background: var(--border);
    padding: 4px;
    border-radius: 8px;
  }
  .tab {
    padding: 6px 16px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 700;
  }

  /* ── Layout ── */
  .app { display: flex; height: calc(100vh - 57px); }

  /* ── Sidebar ── */
  .sidebar {
    width: 340px;
    min-width: 340px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .add-btn:hover { background: #c73652; transform: translateY(-1px); }

  .member-list { overflow-y: auto; flex: 1; padding: 12px; }
  .member-list::-webkit-scrollbar { width: 4px; }
  .member-list::-webkit-scrollbar-track { background: transparent; }
  .member-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .member-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .member-card:hover { border-color: var(--accent); transform: translateX(2px); }
  .member-card.selected { border-color: var(--accent); background: #1a0810; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .card-info {}
  .card-name { font-size: 13px; font-weight: 700; }
  .card-id { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: 2px; }
  .card-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .card-earnings {
    text-align: right;
  }
  .earn-amount { font-size: 13px; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--green); }
  .earn-label { font-size: 10px; color: var(--muted); }

  /* ── Stats bar ── */
  .stats-bar {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .stat-item { text-align: center; }
  .stat-value { font-size: 16px; font-weight: 900; font-family: 'Space Mono', monospace; }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* ── Main area ── */
  .main { flex: 1; overflow: hidden; position: relative; }

  /* ── Tree view ── */
  #tree-view {
    width: 100%; height: 100%;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(ellipse at 50% 0%, #1a0a1a 0%, var(--bg) 60%);
  }

  .tree-container { position: relative; }

  svg.tree-svg {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }

  .tree-level {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 60px;
    position: relative;
  }

  .tree-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .node-circle {
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 12px;
    color: #fff;
    border: 3px solid rgba(255,255,255,0.15);
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    position: relative;
    z-index: 2;
  }
  .node-circle:hover { transform: scale(1.1); }
  .node-circle .node-name { font-size: 13px; font-weight: 700; }
  .node-circle .node-earn { font-size: 10px; opacity: 0.85; font-family: 'Space Mono', monospace; }

  .node-label {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-family: 'Space Mono', monospace;
    max-width: 80px;
    word-break: break-all;
  }

  /* level colors */
  .node-you .node-circle { background: linear-gradient(135deg, #e94560, #c73652); border-color: #e94560; box-shadow: 0 4px 24px rgba(233,69,96,0.5); }
  .node-l1 .node-circle { background: linear-gradient(135deg, #f5a623, #d4891c); border-color: #f5a623; box-shadow: 0 4px 20px rgba(245,166,35,0.4); }
  .node-l2 .node-circle { background: linear-gradient(135deg, #4ecdc4, #3ab5ac); border-color: #4ecdc4; box-shadow: 0 4px 20px rgba(78,205,196,0.4); }
  .node-l3 .node-circle { background: linear-gradient(135deg, #6c7a8d, #4a5568); border-color: #6c7a8d; }

  /* connector lines */
  .connector { stroke: #2a2a44; stroke-width: 2; fill: none; }

  /* ── Table view ── */
  #table-view {
    display: none;
    width: 100%; height: 100%;
    overflow: auto;
    padding: 24px;
    background: var(--bg);
  }

  .pay-table { width: 100%; border-collapse: collapse; }
  .pay-table th {
    background: var(--surface);
    padding: 12px 16px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .pay-table td {
    padding: 12px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .pay-table tr:hover td { background: var(--surface); }
  .mono { font-family: 'Space Mono', monospace; }
  .amount { color: var(--green); font-weight: 700; font-family: 'Space Mono', monospace; }
  .you-row td { background: #1a0810 !important; }

  /* ── Modal ── */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 420px;
    max-width: 95vw;
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn { from { opacity:0; transform:translateY(16px) scale(0.97); } to { opacity:1; transform:none; } }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .form-row { margin-bottom: 16px; }
  .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; font-weight: 700; }
  .form-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-cancel {
    flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px;
    transition: all 0.2s;
  }
  .btn-cancel:hover { border-color: var(--text); color: var(--text); }
  .btn-save {
    flex: 2; padding: 10px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 700;
    transition: all 0.2s;
  }
  .btn-save:hover { background: #c73652; }

  /* legend */
  .legend {
    position: absolute;
    bottom: 20px; right: 20px;
    background: rgba(13,13,20,0.9);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    backdrop-filter: blur(8px);
  }
  .legend-title { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 10px; letter-spacing: 0.06em; }
  .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 12px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

  /* tooltip */
  .tooltip {
    display: none;
    position: absolute;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    z-index: 50;
    min-width: 200px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .tooltip.show { display: block; }
  .tt-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .tt-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .tt-label { color: var(--muted); }
  .tt-value { font-family: 'Space Mono', monospace; font-weight: 700; }
  .tt-green { color: var(--green); }
  .tt-gold { color: var(--l1-color); }
  .tt-teal { color: var(--l2-color); }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 4px;
  }
  .badge-you { background: rgba(233,69,96,0.2); color: var(--you-color); }
  .badge-l1  { background: rgba(245,166,35,0.2); color: var(--l1-color); }
  .badge-l2  { background: rgba(78,205,196,0.2); color: var(--l2-color); }

  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%;
    color: var(--muted);
    gap: 12px;
  }
  .empty-icon { font-size: 48px; }

  .delete-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 16px; padding: 4px;
    transition: color 0.2s; border-radius: 4px;
  }
  .delete-btn:hover { color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>紹介ネットワーク管理</h1>
  <span id="sync-status" style="font-size:11px;color:#666880;font-family:'Space Mono',monospace;margin-left:auto;">GAS未設定</span>
  <button onclick="syncFromGAS()" style="background:rgba(255,255,255,0.06);border:1px solid #1e1e32;border-radius:6px;color:#e8eaf0;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;">🔄 今すぐ同期</button>
  <div class="tab-bar">
    <button class="tab active" onclick="switchView('tree')">🌳 ツリー図</button>
    <button class="tab" onclick="switchView('table')">📊 支払い表</button>
  </div>
</header>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>メンバー</h2>
      <button class="add-btn" onclick="openModal()">＋ 追加</button>
    </div>
    <div class="member-list" id="member-list"></div>
    <div class="stats-bar" id="stats-bar"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Tree view -->
    <div id="tree-view">
      <div id="tree-empty" class="empty-state">
        <div class="empty-icon">🌱</div>
        <div>メンバーを追加するとツリー図が表示されます</div>
      </div>
      <div id="tree-content" style="display:none; position:relative; min-width:600px;"></div>
    </div>

    <!-- Table view -->
    <div id="table-view">
      <table class="pay-table" id="pay-table">
        <thead>
          <tr>
            <th>名前</th>
            <th>役割</th>
            <th>紹介者</th>
            <th>月次収益</th>
            <th>あなた (10%)</th>
            <th>L1受取 (10%)</th>
            <th>L2受取 (5%)</th>
            <th>投資家手取 (75%)</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
        <tfoot id="table-foot"></tfoot>
      </table>
    </div>

    <!-- Legend -->
    <div class="legend" id="legend">
      <div class="legend-title">LEVEL</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e94560;box-shadow:0 0 8px #e94560"></div> あなた（固定10%）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f5a623;box-shadow:0 0 8px #f5a623"></div> 第1レベル（直紹介 10%）</div>
      <div class="legend-item"><div class="legend-dot" style="background:#4ecdc4;box-shadow:0 0 8px #4ecdc4"></div> 第2レベル（間接紹介 5%）</div>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="modal-title">メンバー追加</h3>
    <div class="form-row">
      <label class="form-label">名前 *</label>
      <input class="form-input" id="f-name" placeholder="例：田中さん">
    </div>
    <div class="form-row-2">
      <div class="form-row" style="margin:0">
        <label class="form-label">メンバーID *</label>
        <input class="form-input" id="f-id" placeholder="例：T001">
      </div>
      <div class="form-row" style="margin:0">
        <label class="form-label">月次収益 (USDT)</label>
        <input class="form-input" id="f-income" type="number" placeholder="0.00" step="0.01">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">直紹介者ID（誰に紹介されたか）</label>
      <input class="form-input" id="f-referrer" placeholder="空白＝あなたが直接紹介">
    </div>
    <div class="form-row">
      <label class="form-label">MetaMaskアドレス</label>
      <input class="form-input" id="f-wallet" placeholder="0x...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveMember()">保存</button>
    </div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────
let members = JSON.parse(localStorage.getItem('referral_members') || '[]');
let editId = null;

const RATES = { you: 0.10, l1: 0.10, l2: 0.05 };

const COLORS = ['#e94560','#f5a623','#4ecdc4','#a78bfa','#34d399','#60a5fa','#f472b6','#fb923c'];
function colorFor(id) {
  let h = 0; for (let c of id) h = (h*31 + c.charCodeAt(0)) & 0xffff;
  return COLORS[h % COLORS.length];
}

function save() { localStorage.setItem('referral_members', JSON.stringify(members)); }

// ── Modal ─────────────────────────────────────────────────────────
function openModal(id = null) {
  editId = id;
  const m = id ? members.find(x => x.id === id) : null;
  document.getElementById('modal-title').textContent = id ? 'メンバー編集' : 'メンバー追加';
  document.getElementById('f-name').value    = m?.name    || '';
  document.getElementById('f-id').value      = m?.id      || '';
  document.getElementById('f-income').value  = m?.income  || '';
  document.getElementById('f-referrer').value= m?.referrer|| '';
  document.getElementById('f-wallet').value  = m?.wallet  || '';
  document.getElementById('f-id').disabled   = !!id;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-bg'))
    document.getElementById('modal-bg').classList.remove('open');
}
function saveMember() {
  const name    = document.getElementById('f-name').value.trim();
  const id      = editId || document.getElementById('f-id').value.trim();
  const income  = parseFloat(document.getElementById('f-income').value) || 0;
  const referrer= document.getElementById('f-referrer').value.trim();
  const wallet  = document.getElementById('f-wallet').value.trim();
  if (!name || !id) { alert('名前とIDは必須です'); return; }
  if (!editId && members.find(x => x.id === id)) { alert('このIDはすでに使われています'); return; }
  if (editId) {
    const m = members.find(x => x.id === editId);
    Object.assign(m, { name, income, referrer, wallet });
  } else {
    members.push({ id, name, income, referrer, wallet });
  }
  save();
  // GASにも月次収益を反映
  pushIncomeToGAS(id, income, name);
  render(); closeModal();
}
function deleteMember(id) {
  if (!confirm(`${members.find(x=>x.id===id)?.name} を削除しますか？`)) return;
  members = members.filter(x => x.id !== id);
  // also clear referrers pointing to this id
  members.forEach(m => { if(m.referrer===id) m.referrer=''; });
  save(); render();
}

// ── あなたのID ────────────────────────────────────────────────────
const YOUR_ID = '21Q46';

// ── Compute ───────────────────────────────────────────────────────
function getLevel(m) {
  if (m.referrer === YOUR_ID) return 1;
  const ref = members.find(x => x.id === m.referrer);
  if (ref && ref.referrer === YOUR_ID) return 2;
  return 3;
}

function getReferrerName(id) {
  if (!id || id === YOUR_ID) return 'あなた';
  return members.find(x => x.id === id)?.name || id;
}

function getL1L2(m) {
  // mの直紹介者
  const refId = m.referrer;
  // 直紹介者があなた → このメンバーはL1、L1報酬受取者なし、L2報酬受取者なし
  if (!refId || refId === YOUR_ID) return { l1id: null, l2id: null };
  // 直紹介者が存在する → L1報酬はその人が受取
  const l1id = refId;
  const l1m  = members.find(x => x.id === l1id);
  // L1の紹介者があなた → L2報酬受取者なし
  // L1の紹介者が別の人 → その人がL2報酬受取
  const l2id = (l1m && l1m.referrer && l1m.referrer !== YOUR_ID) ? l1m.referrer : null;
  return { l1id, l2id };
}

function computePayouts() {
  // For each member, calculate amounts owed to you/l1/l2
  // Then aggregate per person
  const payoutMap = {}; // id → { name, l1total, l2total }
  members.forEach(m => {
    if (!m.income) return;
    const { l1id, l2id } = getL1L2(m);
    if (l1id) {
      if (!payoutMap[l1id]) payoutMap[l1id] = { name: getReferrerName(l1id), l1: 0, l2: 0 };
      payoutMap[l1id].l1 += m.income * RATES.l1;
    }
    if (l2id) {
      if (!payoutMap[l2id]) payoutMap[l2id] = { name: getReferrerName(l2id), l1: 0, l2: 0 };
      payoutMap[l2id].l2 += m.income * RATES.l2;
    }
  });
  return payoutMap;
}

// ── Render Sidebar ────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('member-list');
  const payoutMap = computePayouts();
  
  if (members.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:32px;color:var(--muted);font-size:13px;">まだメンバーがいません</div>';
  } else {
    list.innerHTML = members.map(m => {
      const lv = getLevel(m);
      const lvLabel = lv===1?'第1レベル':'第2レベル';
      const color = lv===1?'var(--l1-color)':'var(--l2-color)';
      const pm = payoutMap[m.id];
      const earning = pm ? (pm.l1 + pm.l2) : 0;
      return `
      <div class="member-card" onclick="openModal('${m.id}')">
        <div class="avatar" style="background:${colorFor(m.id)}">${m.name[0]}</div>
        <div class="card-info">
          <div class="card-name">${m.name}</div>
          <div class="card-id">${m.id}</div>
          <div class="card-meta" style="color:${color}">${lvLabel} · 紹介：${getReferrerName(m.referrer)}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${earning>0?`<div class="earn-amount">+${earning.toFixed(2)}</div><div class="earn-label">受取/月</div>`:''}
          <button class="delete-btn" onclick="event.stopPropagation();deleteMember('${m.id}')" title="削除">✕</button>
        </div>
      </div>`;
    }).join('');
  }

  // Stats
  const totalIncome = members.reduce((s,m) => s+(m.income||0), 0);
  const yourCut = totalIncome * RATES.you;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-item">
      <div class="stat-value" style="color:var(--text)">${members.length}</div>
      <div class="stat-label">メンバー数</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" style="color:var(--l1-color)">${totalIncome.toFixed(0)}</div>
      <div class="stat-label">総月次収益</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" style="color:var(--you-color)">${yourCut.toFixed(2)}</div>
      <div class="stat-label">あなた受取</div>
    </div>
  `;
}

// ── Render Tree ───────────────────────────────────────────────────
function renderTree() {
  const empty   = document.getElementById('tree-empty');
  const content = document.getElementById('tree-content');

  if (members.length === 0) {
    empty.style.display   = 'flex';
    content.style.display = 'none';
    return;
  }
  empty.style.display   = 'none';
  content.style.display = 'block';

  // Build levels using YOUR_ID as root
  const l1 = members.filter(m => m.referrer === YOUR_ID);
  const l2 = members.filter(m => {
    const ref = members.find(x => x.id === m.referrer);
    return ref && ref.referrer === YOUR_ID;
  });

  const NODE_W = 100; // node slot width
  const NODE_H = 72;
  const LEVEL_GAP = 90;
  const NODE_R = 36; // radius

  // Layout
  // Calculate total width needed
  const maxPerRow = Math.max(1, l1.length, l2.length);
  const totalW = Math.max(400, maxPerRow * (NODE_W + 20) + 80);

  // Helper: x center for index in N items in totalW
  function xFor(i, n) {
    const spacing = Math.min(NODE_W + 20, (totalW - 80) / Math.max(1, n));
    const start   = (totalW - spacing * (n-1)) / 2;
    return start + spacing * i;
  }

  const youX = totalW / 2;
  const youY = NODE_R + 10;

  // positions
  const positions = {};
  positions['__you__'] = { x: youX, y: youY };
  l1.forEach((m, i) => {
    positions[m.id] = { x: xFor(i, l1.length), y: youY + LEVEL_GAP + NODE_R };
  });
  l2.forEach((m, i) => {
    positions[m.id] = { x: xFor(i, l2.length), y: youY + (LEVEL_GAP + NODE_R) * 2 };
  });

  const svgH = youY + (LEVEL_GAP + NODE_R) * (l2.length > 0 ? 2 : 1) + NODE_R + 60;

  // SVG lines
  const lines = [];
  // you → L1
  l1.forEach(m => {
    const p = positions[m.id];
    lines.push(`<line x1="${youX}" y1="${youY+NODE_R}" x2="${p.x}" y2="${p.y-NODE_R}" class="connector"/>`);
  });
  // L1 → L2
  l2.forEach(m => {
    const refPos = positions[m.referrer];
    const myPos  = positions[m.id];
    if (refPos && myPos) {
      lines.push(`<line x1="${refPos.x}" y1="${refPos.y+NODE_R}" x2="${myPos.x}" y2="${myPos.y-NODE_R}" class="connector"/>`);
    }
  });

  // Build HTML
  let html = `<svg class="tree-svg" width="${totalW}" height="${svgH}" style="width:${totalW}px;height:${svgH}px">${lines.join('')}</svg>`;
  html += `<div style="position:relative;width:${totalW}px;height:${svgH}px">`;

  // You node
  html += nodeHTML('__you__', 'あなた', 'node-you', youX, youY, null, true);
  // L1 nodes
  l1.forEach(m => html += nodeHTML(m.id, m.name, 'node-l1', positions[m.id].x, positions[m.id].y, m));
  // L2 nodes
  l2.forEach(m => html += nodeHTML(m.id, m.name, 'node-l2', positions[m.id].x, positions[m.id].y, m));

  html += '</div>';
  content.innerHTML = html;
  content.style.width  = totalW + 'px';
  content.style.height = svgH + 'px';
}

function nodeHTML(id, name, cls, cx, cy, m, isYou=false) {
  const income = m?.income || 0;
  const earnStr = income > 0 ? `${income.toFixed(0)}` : '';
  const tooltip = m ? buildTooltip(m) : '';
  return `
  <div class="tree-node ${cls}"
    style="position:absolute;left:${cx}px;top:${cy}px;transform:translate(-50%,-50%)"
    onmouseenter="showTip(event,'${id}')"
    onmouseleave="hideTip()"
    onclick="${isYou ? '' : `openModal('${id}')`}"
  >
    <div class="node-circle">
      <span class="node-name">${name.length>5?name.slice(0,5)+'…':name}</span>
      ${earnStr ? `<span class="node-earn">${earnStr}</span>` : ''}
    </div>
    <div class="node-label">${isYou?'固定10%':m?.id||''}</div>
  </div>`;
}

// ── Tooltip ───────────────────────────────────────────────────────
function showTip(e, id) {
  const tt = document.getElementById('tooltip');
  if (id === '__you__') {
    const total = members.reduce((s,m)=>s+(m.income||0),0);
    tt.innerHTML = `<div class="tt-name">あなた</div>
      <div class="tt-row"><span class="tt-label">全メンバー月次合計</span><span class="tt-value">${total.toFixed(2)} USDT</span></div>
      <div class="tt-row"><span class="tt-label">あなた受取（10%）</span><span class="tt-value tt-green">${(total*0.1).toFixed(2)} USDT</span></div>`;
  } else {
    const m = members.find(x=>x.id===id);
    if (!m) return;
    const { l1id, l2id } = getL1L2(m);
    const l1pay = (m.income||0) * RATES.l1;
    const l2pay = (m.income||0) * RATES.l2;
    const youPay = (m.income||0) * RATES.you;
    tt.innerHTML = `
      <div class="tt-name">${m.name} <span style="font-size:11px;color:var(--muted)">${m.id}</span></div>
      <div class="tt-row"><span class="tt-label">月次収益</span><span class="tt-value">${(m.income||0).toFixed(2)} USDT</span></div>
      <div class="tt-row"><span class="tt-label">あなた受取</span><span class="tt-value tt-green">${youPay.toFixed(2)} USDT</span></div>
      ${l1id?`<div class="tt-row"><span class="tt-label">L1受取（${getReferrerName(l1id)}）</span><span class="tt-value tt-gold">${l1pay.toFixed(2)} USDT</span></div>`:''}
      ${l2id?`<div class="tt-row"><span class="tt-label">L2受取（${getReferrerName(l2id)}）</span><span class="tt-value tt-teal">${l2pay.toFixed(2)} USDT</span></div>`:''}
      ${m.wallet?`<div class="tt-row" style="margin-top:6px"><span class="tt-label" style="word-break:break-all;font-size:10px">${m.wallet.slice(0,12)}…</span></div>`:''}
    `;
  }
  const rect = e.currentTarget.getBoundingClientRect();
  tt.style.left = (rect.right + 12) + 'px';
  tt.style.top  = (rect.top - 20) + 'px';
  tt.classList.add('show');
}
function hideTip() { document.getElementById('tooltip').classList.remove('show'); }

// ── Render Table ──────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('table-body');
  const tfoot = document.getElementById('table-foot');
  const payoutMap = computePayouts();

  let totalIncome=0, totalYou=0, totalL1=0, totalL2=0, totalInvestor=0;

  tbody.innerHTML = members.map(m => {
    const inc = m.income || 0;
    const you = inc * RATES.you;
    const { l1id, l2id } = getL1L2(m);
    const l1  = l1id ? inc * RATES.l1 : 0;
    const l2  = l2id ? inc * RATES.l2 : 0;
    const investor = inc - you - l1 - l2;
    totalIncome += inc; totalYou += you; totalL1 += l1; totalL2 += l2; totalInvestor += investor;
    const lv = getLevel(m);
    const badge = lv===1?'<span class="badge badge-l1">L1</span>':'<span class="badge badge-l2">L2</span>';
    return `<tr>
      <td><strong>${m.name}</strong> <span class="mono" style="color:var(--muted);font-size:11px">${m.id}</span></td>
      <td>${badge}</td>
      <td>${getReferrerName(m.referrer)}</td>
      <td class="mono">${inc>0?inc.toFixed(2):'-'}</td>
      <td class="amount">${you>0?you.toFixed(2):'-'}</td>
      <td class="mono" style="color:var(--l1-color)">${l1>0?l1.toFixed(2):'-'}</td>
      <td class="mono" style="color:var(--l2-color)">${l2>0?l2.toFixed(2):'-'}</td>
      <td class="mono">${investor>0?investor.toFixed(2):'-'}</td>
    </tr>`;
  }).join('');

  // Payout summary per referrer
  let payRows = '';
  Object.entries(payoutMap).forEach(([id, p]) => {
    const total = p.l1 + p.l2;
    if (total <= 0) return;
    payRows += `<tr style="background:#0a1a14">
      <td colspan="5" style="color:var(--muted);font-size:12px">送付先：<strong style="color:var(--text)">${p.name}</strong> (${id})</td>
      <td class="mono" style="color:var(--l1-color)">${p.l1>0?p.l1.toFixed(2):'-'}</td>
      <td class="mono" style="color:var(--l2-color)">${p.l2>0?p.l2.toFixed(2):'-'}</td>
      <td class="amount">${total.toFixed(2)}</td>
    </tr>`;
  });

  tfoot.innerHTML = `
    <tr style="border-top:2px solid var(--border)">
      <td colspan="3" style="font-weight:700;color:var(--muted)">合計</td>
      <td class="mono" style="font-weight:700">${totalIncome.toFixed(2)}</td>
      <td class="amount">${totalYou.toFixed(2)}</td>
      <td class="mono" style="color:var(--l1-color);font-weight:700">${totalL1.toFixed(2)}</td>
      <td class="mono" style="color:var(--l2-color);font-weight:700">${totalL2.toFixed(2)}</td>
      <td class="mono" style="font-weight:700">${totalInvestor.toFixed(2)}</td>
    </tr>
    <tr><td colspan="8" style="padding-top:16px;font-size:12px;color:var(--muted);font-weight:700">── 月末送付先リスト ──</td></tr>
    ${payRows || '<tr><td colspan="8" style="color:var(--muted);font-size:13px">紹介者への支払いはまだありません</td></tr>'}
  `;
}

// ── View switcher ─────────────────────────────────────────────────
function switchView(v) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (v==='tree'&&i===0)||(v==='table'&&i===1)));
  document.getElementById('tree-view').style.display  = v==='tree'  ? 'flex' : 'none';
  document.getElementById('table-view').style.display = v==='table' ? 'block': 'none';
  document.getElementById('legend').style.display     = v==='tree'  ? 'block': 'none';
}

function render() {
  renderSidebar();
  renderTree();
  renderTable();
}

const GAS_URL = 'https://script.google.com/macros/s/AKfycbzg4hezdk6HIZbdiFAWu9MwUlQ9wiIxbugy4S8ONoSeNKnLBnWm8M-OCeCpM0s6dYE/exec';

async function syncFromGAS() {
  if (false) {
    if (members.length === 0) {
      members = [
        { id:'A001', name:'田中さん',  income:120, referrer:'',     wallet:'0xAbC...' },
        { id:'B001', name:'鈴木さん',  income:80,  referrer:'',     wallet:'0xDeF...' },
        { id:'C001', name:'佐藤さん',  income:200, referrer:'',     wallet:'0xGhI...' },
        { id:'D001', name:'山田さん',  income:60,  referrer:'A001', wallet:'0xJkL...' },
        { id:'E001', name:'伊藤さん',  income:40,  referrer:'A001', wallet:'0xMnO...' },
        { id:'F001', name:'渡辺さん',  income:150, referrer:'B001', wallet:'0xPqR...' },
        { id:'G001', name:'中村さん',  income:90,  referrer:'C001', wallet:'0xStU...' },
        { id:'H001', name:'小林さん',  income:30,  referrer:'D001', wallet:'0xVwX...' },
      ];
      save();
    }
    render();
    return;
  }

  setSyncStatus('syncing');
  try {
    const res  = await fetch(`${GAS_URL}?action=getMembers`);
    const data = await res.json();
    if (data.ok && data.members) {
      const localMap = {};
      members.forEach(m => { localMap[m.id] = m; });
      members = data.members.map(m => ({
        ...m,
        income: (localMap[m.id]?.income > 0) ? localMap[m.id].income : (m.income || 0),
        name:   localMap[m.id]?.name || m.name || m.id,
      }));
      save();
      setSyncStatus('ok');
    } else {
      setSyncStatus('error');
    }
  } catch (err) {
    setSyncStatus('error');
  }
  render();
}

async function pushIncomeToGAS(id, income, name) {
  if (false) return;
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateIncome', id, income, name }),
    });
  } catch(e) {}
}

function setSyncStatus(state) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  const map = {
    syncing: { text: '同期中...', color: '#f5a623' },
    ok:      { text: '✓ 同期済み', color: '#2ecc71' },
    error:   { text: '⚠ 同期エラー', color: '#e94560' },
  };
  el.textContent = map[state].text;
  el.style.color = map[state].color;
}

// 初回表示はローカルキャッシュを使い、その後GASで更新
if (members.length > 0) render();
syncFromGAS();
setInterval(syncFromGAS, 30000);
